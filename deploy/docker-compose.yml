# RevenueOS on the home server (hosted-apps@maadu, ~/services/revenueos).
#
#   app  web app + API on 127.0.0.1:REVENUEOS_PORT (localhost only; exposed through the Cloudflare tunnel
#        as revenueos.hiruthicsha.com -> http://localhost:REVENUEOS_PORT).
#   db   Postgres for the CRM data. Conversational memory lives in Hindsight Cloud.
#
# The image is built locally and loaded onto the server by scripts/deploy.py; restart.py runs `up -d`.
# Settings come from .env next to this file (see deploy/.env.example). deploy.py re-uploads this file.

name: revenueos

services:
  app:
    image: revenueos/app:${REVENUEOS_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgres://revenueos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/revenueos
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REVENUEOS_PORT:-1039}:4000"
    networks: [app]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revenueos
      POSTGRES_DB: revenueos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueos -d revenueos"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app]

volumes:
  db-data:

networks:
  app:
